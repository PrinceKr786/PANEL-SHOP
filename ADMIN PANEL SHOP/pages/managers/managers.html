<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <title>Nexus Admin | Managers Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/styles/base.css">
    <link rel="stylesheet" href="managers.css">
    <script src="../../assets/scripts/security.js"></script>

<body>
    <div class="dash-bg-engine"><div class="dash-grid"></div><div class="dash-glow top-left"></div><div class="dash-glow bottom-right"></div></div>
    <div id="sidebarContainer"></div>
    <main class="main-content-wrapper">
        <header class="dash-header glass-header"><div class="header-left"><button id="mobileMenuBtn" class="mobile-menu-toggle" type="button" aria-label="Open sidebar"><i class="fas fa-bars-staggered"></i></button><div class="page-title-box"><h1 id="page-title" class="cyber-title">Managers Control</h1><div class="title-underline"></div></div></div><div class="header-right"><span class="page-pending-badge" id="pageBadge"></span><div class="live-status"><span class="pulse-dot"></span> <span class="status-text">SYSTEM ONLINE</span></div><button id="sidebarThemeToggle" class="sidebar-theme-toggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button><div class="admin-profile-chip"><div class="admin-avatar"><i class="fas fa-user-shield"></i></div><span id="headerAdminEmail" class="admin-email">ADMIN</span></div></div></header>
        <div class="sections-container custom-scrollbar">
            <section class="page-section active-section">
                <div class="dash-box glass-panel">
                    <div class="box-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                        <h2><i class="fas fa-user-cog" style="color:#00f0ff;margin-right:10px;"></i> Manager Staff</h2>
                        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                            <button class="qa-btn" style="padding:8px 16px;font-size:11px;" onclick="loadManagers()"><i class="fas fa-sync-alt"></i> Refresh</button>
                        </div>
                    </div>
                    <div class="add-manager-box">
                        <i class="fas fa-user-plus" style="color:#00f0ff;font-size:15px;"></i>
                        <input type="text" id="managerUidInput" placeholder="Paste user UID to promote as Manager..." style="flex:1;min-width:200px;padding:9px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#fff;font-size:13px;outline:none;">
                        <button class="action-btn action-approve" onclick="addManager()"><i class="fas fa-check"></i> Make Manager</button>
                    </div>
                    <div style="max-height:600px;overflow-y:auto;overflow-x:auto;width:100%;">
                        <table class="users-table">
                            <thead><tr><th>Manager</th><th>UID</th><th>Added</th><th>Actions</th></tr></thead>
                            <tbody id="managersTbody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="managersToastContainer"></div>
    <div id="managersLoader" class="loader-overlay hidden"><div class="spinner"></div></div>

    <script type="module" src="managers.js"></script>
    <script type="module">
        import { loadSidebar } from '../../assets/scripts/sidebar-loader.js';
        import { markSeen } from '../../assets/scripts/badges.js';
        import { db, ref, onValue } from '../../assets/scripts/firebase.js';
        document.addEventListener('DOMContentLoaded', () => {
            loadSidebar();
            markSeen('managers');
        });
        onValue(ref(db, 'managers'), (snap) => {
            const data = snap.val();
            const el = document.getElementById('pageBadge');
            if (!el) return;
            if (!data) { el.textContent = ''; el.style.display = 'none'; return; }
            const lastSeen = parseInt(localStorage.getItem('adminSeen_managers') || '0') || Date.now();
            const count = Object.keys(data).filter(uid => (data[uid].addedAt || 0) > lastSeen).length;
            el.textContent = count > 0 ? count + ' new' : '';
            el.style.display = count > 0 ? '' : 'none';
        });
    </script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(()=>{});</script>
</body>
</html>
