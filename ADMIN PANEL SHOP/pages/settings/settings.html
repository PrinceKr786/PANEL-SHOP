<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <title>Nexus Admin | Payment Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/styles/base.css">
    <link rel="stylesheet" href="settings.css">
    <script src="../../assets/scripts/security.js"></script>

<body>
    <div class="dash-bg-engine"><div class="dash-grid"></div><div class="dash-glow top-left"></div><div class="dash-glow bottom-right"></div></div>
    <div id="sidebarContainer"></div>
    <main class="main-content-wrapper">
        <header class="dash-header glass-header"><div class="header-left"><button id="mobileMenuBtn" class="mobile-menu-toggle" type="button" aria-label="Open sidebar"><i class="fas fa-bars-staggered"></i></button><div class="page-title-box"><h1 id="page-title" class="cyber-title">Payment Settings</h1><div class="title-underline"></div></div></div><div class="header-right"><div class="live-status"><span class="pulse-dot"></span> <span class="status-text">SYSTEM ONLINE</span></div><button id="sidebarThemeToggle" class="sidebar-theme-toggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button><div class="admin-profile-chip"><div class="admin-avatar"><i class="fas fa-user-shield"></i></div><span id="headerAdminEmail" class="admin-email">ADMIN</span></div></div></header>
        <div class="sections-container custom-scrollbar">
            <section class="page-section active-section">
                <div class="settings-grid">

                    <!-- 1. AUTO PAYMENT (API) -->
                    <div class="dash-box glass-panel">
                        <div class="box-header"><h2><i class="fas fa-bolt" style="color:#3b82f6;margin-right:8px;"></i> Auto Payment (API)</h2></div>
                        <div class="form-group"><label>ZapUPI API Key <span style="color:#ffb800;font-size:11px;">(Required for auto-verification)</span></label><input id="setZapKey" class="form-input" type="text" placeholder="Enter your ZapUPI Key"/></div>
                        <button class="qa-btn save-btn" style="margin-top:10px;" onclick="saveAutoPayment()"><i class="fas fa-save"></i> Save API Settings</button>
                    </div>

                    <!-- 2. MANUAL PAYMENT (UPI) -->
                    <div class="dash-box glass-panel">
                        <div class="box-header"><h2><i class="fas fa-mobile-alt" style="color:#10b981;margin-right:8px;"></i> Manual Payment (UPI)</h2></div>
                        <div class="form-group"><label>Manual Deposit UPI ID</label><input id="setUpi" class="form-input" type="text" placeholder="yourname@upi"/></div>
                        <div class="form-group"><label>Manual Deposit QR Code URL</label><input id="setQr" class="form-input" type="url" placeholder="https://..."/></div>
                        <div id="qrPreview" style="margin-bottom:10px;text-align:center;"></div>
                        <button class="qa-btn save-btn" onclick="saveManualPayment()"><i class="fas fa-save"></i> Save UPI Settings</button>
                    </div>

                    <!-- 3. CRYPTO SETTINGS -->
                    <div class="dash-box glass-panel">
                        <div class="box-header"><h2><i class="fab fa-bitcoin" style="color:#F3BA2F;margin-right:8px;"></i> Crypto Settings</h2></div>
                        <div class="form-group"><label>Binance Pay ID</label><input id="setCryptoPayid" class="form-input" type="text" placeholder="e.g., 123456789"/></div>
                        <div class="form-group"><label>USDT Address (TRC20)</label><input id="setCryptoAddress" class="form-input" type="text" placeholder="T..."/></div>
                        <div class="form-group"><label>Crypto QR Code URL</label><input id="setCryptoQr" class="form-input" type="url" placeholder="https://..."/></div>
                        <div id="cryptoQrPreview" style="margin-bottom:10px;text-align:center;"></div>
                        <button class="qa-btn save-btn" onclick="saveCryptoSettings()"><i class="fas fa-save"></i> Save Crypto Settings</button>
                    </div>

                    <!-- 4. GLOBAL USDT RATE -->
                    <div class="dash-box glass-panel">
                        <div class="box-header"><h2><i class="fas fa-globe" style="color:#a855f7;margin-right:8px;"></i> Global USDT Rate</h2></div>
                        <div class="form-group"><label>1 USDT = ? INR <span style="color:#ffb800;font-size:11px;">(Applies everywhere)</span></label><input id="setCryptoRate" class="form-input" type="number" step="0.01" min="0" placeholder="88.00"/></div>
                        <p style="font-size:11px;color:#888;margin:-10px 0 10px;"><i class="fas fa-info-circle" style="margin-right:5px;"></i>Current rate: 1 USDT = ₹<span id="currentRateDisplay">88.00</span></p>
                        <button class="qa-btn save-btn" onclick="saveCryptoRate()"><i class="fas fa-save"></i> Save Rate</button>
                    </div>

                </div>
            </section>
        </div>
    </main>

    <div id="settingsToastContainer"></div>
    <div id="settingsLoader" class="loader-overlay hidden"><div class="spinner"></div></div>

    <style>
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width:768px) { .settings-grid { grid-template-columns: 1fr; } }
        .save-btn { width:100%; justify-content:center; padding:12px; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; color:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.3s ease; }
        .save-btn:hover { background:rgba(188,19,254,0.15); border-color:#bc13fe; }
    </style>

    <script type="module" src="settings.js"></script>
    <script type="module">
        import { loadSidebar } from '../../assets/scripts/sidebar-loader.js';
        document.addEventListener('DOMContentLoaded', () => loadSidebar());
    </script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(()=>{});</script>
</body>
</html>
