<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <title>Nexus Admin | Manage Panels</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/styles/base.css">
    <link rel="stylesheet" href="manage-panels.css">
    <script src="../../assets/scripts/security.js"></script>

<body>
    <div class="dash-bg-engine"><div class="dash-grid"></div><div class="dash-glow top-left"></div><div class="dash-glow bottom-right"></div></div>
    <div id="sidebarContainer"></div>
    <main class="main-content-wrapper">
        <header class="dash-header glass-header"><div class="header-left"><button id="mobileMenuBtn" class="mobile-menu-toggle" type="button" aria-label="Open sidebar"><i class="fas fa-bars-staggered"></i></button><div class="page-title-box"><h1 id="page-title" class="cyber-title">Manage Panels</h1><div class="title-underline"></div></div></div><div class="header-right"><div class="live-status"><span class="pulse-dot"></span> <span class="status-text">SYSTEM ONLINE</span></div><button id="sidebarThemeToggle" class="sidebar-theme-toggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button><div class="admin-profile-chip"><div class="admin-avatar"><i class="fas fa-user-shield"></i></div><span id="headerAdminEmail" class="admin-email">ADMIN</span></div></div></header>
        <div class="sections-container custom-scrollbar">
            <section class="page-section active-section">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;"><i class="fas fa-box" style="color:#bc13fe;margin-right:10px;"></i> Panel Inventory</h2>
                    <button class="qa-btn" style="padding:8px 16px;font-size:11px;" onclick="initPanels()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div class="panel-grid" id="panelsContainer"></div>
            </section>
        </div>
    </main>

    <div class="modal-overlay hidden" id="editPanelModal">
        <div class="modal-box" style="max-width:600px;">
            <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;">
                <h3 style="font-size:18px;font-weight:700;">Edit Panel</h3>
                <button class="modal-close-btn" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
            </div>
            <input id="editPanelId" type="hidden"/>
            <div class="form-group"><label>Panel Name</label><input id="editPName" class="form-input" type="text"/></div>
            <div class="form-group"><label>Logo Image URL</label><input id="editPLogo" class="form-input" type="url"/></div>
            <div class="form-group"><label>Category</label><div class="cdrop" id="cdropEdit"><div class="cdrop-trigger" id="cdropEditTrigger"><span class="cdrop-label">Select category...</span><i class="fas fa-chevron-down"></i></div><div class="cdrop-menu" id="cdropEditMenu"></div><select id="editPCategory" class="cdrop-native"><option value="">Select category...</option></select></div></div>
            <div class="form-group"><label>YouTube Link</label><input id="editPYt" class="form-input" type="url"/></div>
            <div class="form-group"><label>Download / Update Link</label><input id="editPLink" class="form-input" type="url"/></div>
            <div class="form-group"><label>Feedback / Telegram Link</label><input id="editPFeedback" class="form-input" type="url"/></div>
            <div class="form-group"><label>Description & Features</label><textarea id="editPDesc" class="form-input" rows="4"></textarea></div>

            <div class="plans-section">
                <div class="plans-header">
                    <label style="margin:0;font-weight:600;"><i class="fas fa-tags" style="color:#bc13fe;"></i> Pricing Plans</label>
                    <button class="qa-btn" style="padding:6px 14px;font-size:11px;" onclick="addEditPlanRow()"><i class="fas fa-plus"></i> Add Plan</button>
                </div>
                <div id="editPlansContainer"></div>
            </div>
            <button class="qa-btn" style="width:100%;justify-content:center;padding:14px;background:rgba(188,19,254,0.15);border-color:#bc13fe;" id="btnSaveEditPanel">Save Changes</button>
        </div>
    </div>

    <div id="panelMngToastContainer"></div>
    <div id="panelMngLoader" class="loader-overlay hidden"><div class="spinner"></div></div>

    <script type="module" src="manage-panels.js"></script>
    <script type="module">
        import { loadSidebar } from '../../assets/scripts/sidebar-loader.js';
        const init = () => loadSidebar();

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    </script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(()=>{});</script>
</body>
</html>
