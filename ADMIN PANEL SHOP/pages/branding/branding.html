<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <title>Nexus Admin | Site Branding</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/styles/base.css">
    <link rel="stylesheet" href="branding.css">
    <style>
        .tab-bar { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
        .tab-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; border-radius:14px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; cursor:pointer; transition:0.3s; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); color:#888; }
        .tab-btn:hover { background:rgba(188,19,254,0.08); border-color:rgba(188,19,254,0.2); color:#fff; }
        .tab-btn.active { background:rgba(188,19,254,0.15); border-color:#bc13fe; color:#fff; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .promo-item { background:rgba(0,0,0,0.2); padding:18px; border-radius:16px; border:1px solid rgba(255,255,255,0.05); display:flex; flex-direction:column; gap:12px; }
    </style>
    <script src="../../assets/scripts/security.js"></script>

<body>
    <div class="dash-bg-engine"><div class="dash-grid"></div><div class="dash-glow top-left"></div><div class="dash-glow bottom-right"></div></div>
    <div id="sidebarContainer"></div>
    <main class="main-content-wrapper">
        <header class="dash-header glass-header"><div class="header-left"><button id="mobileMenuBtn" class="mobile-menu-toggle" type="button" aria-label="Open sidebar"><i class="fas fa-bars-staggered"></i></button><div class="page-title-box"><h1 id="page-title" class="cyber-title">Site Branding</h1><div class="title-underline"></div></div></div><div class="header-right"><div class="live-status"><span class="pulse-dot"></span> <span class="status-text">SYSTEM ONLINE</span></div><button id="sidebarThemeToggle" class="sidebar-theme-toggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button><div class="admin-profile-chip"><div class="admin-avatar"><i class="fas fa-user-shield"></i></div><span id="headerAdminEmail" class="admin-email">ADMIN</span></div></div></header>
        <div class="sections-container custom-scrollbar">
            <section class="page-section active-section">
                <div class="tab-bar">
                    <button class="tab-btn active" id="tabAnnouncement" onclick="switchBrandTab('announcement')"><i class="fas fa-bullhorn"></i> ANNOUNCEMENT</button>
                    <button class="tab-btn" id="tabPromotions" onclick="switchBrandTab('promotions')"><i class="fas fa-tags"></i> PROMOTIONS</button>
                </div>

                <div class="tab-content active" id="tabContentAnnouncement">
                    <div class="dash-box glass-panel" style="max-width:600px;margin:0 auto;">
                        <div class="box-header"><h2><i class="fas fa-image" style="color:#bc13fe;margin-right:8px;"></i> Site Announcement</h2></div>
                        <div class="form-group"><label>Site Name</label><input id="brandName" class="form-input" type="text" placeholder="Nexus Panel"/></div>
                        <div class="form-group"><label>Site Tagline</label><input id="brandTagline" class="form-input" type="text" placeholder="Your tagline here"/></div>
                        <div class="form-group"><label>Announcement Banner <span style="color:#888;font-size:11px;font-weight:400;text-transform:none;">(shown on home page)</span></label>
                            <textarea id="brandAnnouncement" class="form-input" rows="2" placeholder="Welcome! Use code WELCOME10 for 10% off" style="resize:vertical;"></textarea>
                        </div>
                        <div class="form-group"><label>Footer Copyright Text</label><input id="brandFooter" class="form-input" type="text" placeholder="© 2026 Nexus Panel. All rights reserved."/></div>
                        <input id="brandLogo" type="hidden"/>
                        <button class="qa-btn" style="width:100%;justify-content:center;padding:14px;background:rgba(188,19,254,0.15);border-color:#bc13fe;" id="btnSaveBranding"><i class="fas fa-save"></i> UPDATE BRANDING</button>
                    </div>
                    <div class="dash-box glass-panel" style="max-width:600px;margin:20px auto 0;">
                        <div class="box-header"><h2><i class="fas fa-history" style="color:#f59e0b;margin-right:8px;"></i> Announcement History</h2></div>
                        <div id="announcementHistory" style="display:flex;flex-direction:column;"><div style="color:#888;font-size:12px;text-align:center;padding:12px;">Loading...</div></div>
                    </div>
                </div>

                <div class="tab-content" id="tabContentPromotions">
                    <div class="dash-box glass-panel" style="max-width:600px;margin:0 auto;">
                        <div class="box-header"><h2><i class="fas fa-plus-circle" style="color:#bc13fe;margin-right:8px;"></i> Add Promotion</h2></div>
                        <div class="form-group"><label>Title <span style="color:#ff2a5f;">*</span></label><input id="promoTitle" class="form-input" placeholder="E.g., Diwali Special Offer" type="text"/></div>
                        <div class="form-group"><label>Description</label><input id="promoDesc" class="form-input" placeholder="Short description of the offer" type="text"/></div>
                        <div class="form-group"><label>Discount %</label><input id="promoDiscount" class="form-input" placeholder="10" type="number" min="0" max="100"/></div>
                        <div class="form-group"><label>Image URL</label><input id="promoImg" class="form-input" placeholder="https://example.com/banner.jpg" type="url"/></div>
                        <div class="form-group"><label>Redirect Link</label><input id="promoLink" class="form-input" placeholder="https://example.com/offer" type="url"/></div>
                        <button class="qa-btn" style="width:100%;justify-content:center;padding:14px;background:rgba(188,19,254,0.15);border-color:#bc13fe;" id="btnAddPromo"><i class="fas fa-plus"></i> PUBLISH PROMOTION</button>
                    </div>
                    <div class="dash-box glass-panel" style="max-width:600px;margin:20px auto 0;">
                        <div class="box-header">
                            <h2><i class="fas fa-list" style="color:#00f0ff;margin-right:8px;"></i> Active Promotions</h2>
                            <button class="qa-btn" style="padding:8px 16px;font-size:11px;" onclick="loadPromotions()"><i class="fas fa-sync-alt"></i></button>
                        </div>
                        <div id="promotionsList" style="display:flex;flex-direction:column;gap:12px;"><div style="padding:20px;text-align:center;color:#888;">Loading...</div></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="modal-overlay hidden" id="editPromoModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Edit Promotion</h3>
                <button class="modal-close-btn" onclick="closeEditPromo()"><i class="fas fa-times"></i></button>
            </div>
            <input id="editPromoId" type="hidden"/>
            <div class="form-group"><label>Title</label><input id="editPromoTitle" class="form-input" type="text"/></div>
            <div class="form-group"><label>Description</label><input id="editPromoDesc" class="form-input" type="text"/></div>
            <div class="form-group"><label>Discount %</label><input id="editPromoDiscount" class="form-input" type="number" min="0" max="100"/></div>
            <div class="form-group"><label>Image URL</label><input id="editPromoImg" class="form-input" type="url"/></div>
            <div class="form-group"><label>Redirect Link</label><input id="editPromoLink" class="form-input" type="url"/></div>
            <button class="qa-btn" style="width:100%;justify-content:center;padding:14px;background:rgba(188,19,254,0.15);border-color:#bc13fe;" id="btnSaveEditPromo">Save Changes</button>
        </div>
    </div>

    <div id="brandingToastContainer"></div>
    <div id="brandingLoader" class="loader-overlay hidden"><div class="spinner"></div></div>

    <script>
        window.switchBrandTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'announcement') {
                document.getElementById('tabAnnouncement').classList.add('active');
                document.getElementById('tabContentAnnouncement').classList.add('active');
            } else {
                document.getElementById('tabPromotions').classList.add('active');
                document.getElementById('tabContentPromotions').classList.add('active');
                if (typeof loadPromotions === 'function') loadPromotions();
            }
        };
    </script>
    <script type="module" src="branding.js"></script>
    <script type="module">
        import { loadSidebar } from '../../assets/scripts/sidebar-loader.js';
        const init = () => loadSidebar();

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    </script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(()=>{});</script>
</body>
</html>
