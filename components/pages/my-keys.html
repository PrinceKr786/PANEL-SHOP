<script>
    window.notifPopupOpen = false;
    window.openNotificationPopup = function() {
        const container = document.getElementById('notification-container');
        if (!container) return;
        if (window.notifPopupOpen) {
            container.style.display = 'none';
            window.notifPopupOpen = false;
            return;
        }
        container.style.display = '';
        window.notifPopupOpen = true;
        if (window.refreshNotifPopup) window.refreshNotifPopup();
    };
</script>
<script type="module">
    import { auth, db, ref, onValue, get, onAuthStateChanged } from "../../assets/scripts/core/firebase.js";
    onAuthStateChanged(auth, (user) => {
        const li = document.querySelector('.auth-ui-logged-in');
        const lo = document.querySelector('.auth-ui-logged-out');
        if (user) {
            if (li) li.style.display = 'flex';
            if (lo) lo.style.display = 'none';
            const userRef = ref(db, `users/${user.uid}`);
            onValue(userRef, (snap) => {
                if(snap.exists()) {
                    const el = document.getElementById('headerLiveBalance');
                    if(el) { const b = parseFloat(snap.val().balance || 0); el.setAttribute('data-inr', b); el.textContent = window.formatPriceShort ? window.formatPriceShort(b) : '₹' + b.toFixed(2); }
                }
            });
            onValue(ref(db, `notifications/${user.uid}`), async (snap) => {
                const data = snap.val() || {};
                const items = Object.values(data);
                let unread = items.filter(n => !n.read).length;
                try {
                    const gSnap = await get(ref(db, 'global_alerts/promotions'));
                    if (gSnap.exists()) {
                        const seen = JSON.parse(localStorage.getItem('nexus_seen_global_' + user.uid)) || [];
                        Object.keys(gSnap.val()).forEach(id => { if (!seen.includes(id)) unread++; });
                    }
                } catch(_) {}
                try { if (localStorage.getItem('nexus_welcome_' + user.uid) === '1') unread++; } catch(_) {}
                const badge = document.getElementById('notifBadge');
                if (badge) { badge.textContent = unread; badge.style.display = unread > 0 ? 'flex' : 'none'; }
            });
        } else {
            if (li) li.style.display = 'none';
            if (lo) lo.style.display = 'flex';
        }
    });
</script>

<script>
    (function() {
        const isAdminSub = window.location.pathname.includes('/components/') || window.location.pathname.includes('/menubar/');
        const adminLink = document.getElementById('adminPanelLink');
        if (adminLink && isAdminSub) {
            adminLink.setAttribute('href', adminLink.getAttribute('href').replace('../components/pages/', ''));
        }
    })();

    window.toggleNexusMenu = function() {
        const menu = document.getElementById('nexusDropdownMenu');
        if(menu) {
            menu.classList.toggle('active');
            if(navigator.vibrate) navigator.vibrate(15);
        }
    };

    window.addEventListener('click', function(e) {
        const menu = document.getElementById('nexusDropdownMenu');
        const toggleBtn = document.getElementById('headerMenuToggleBtn'); 
        
        if (menu && menu.classList.contains('active')) {
            if (!menu.contains(e.target) && (!toggleBtn || !toggleBtn.contains(e.target))) {
                menu.classList.remove('active');
            }
        }
    });
</script>

<script type="module">
    const fbPath = window.location.pathname.includes('/components/') || window.location.pathname.includes('/menubar/') ? "../../assets/scripts/core/firebase.js" : "../../assets/scripts/core/firebase.js";
    const { auth, db, ref, get, signOut, onAuthStateChanged } = await import(fbPath);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const alias = user.email.split('@')[0];
            document.getElementById('ddEmail').innerText = user.email;
            document.getElementById('ddName').innerText = alias;
            document.getElementById('ddAvatar').innerText = alias.charAt(0).toUpperCase();
                try {
                    const snap = await get(ref(db, `users/${user.uid}`));
                    if (snap.exists()) {
                        const data = snap.val();
                        const uname = data.username || data.name || alias;
                        document.getElementById('ddName').innerText = uname;
                        document.getElementById('ddAvatar').innerText = uname.charAt(0).toUpperCase();
                        if (data.role === 'admin') {
                            const link = document.getElementById('adminPanelLink');
                            if (link) link.style.display = '';
                        }
                    }
                } catch(e) {}
        }
    });

    document.getElementById('ddLogoutBtn').addEventListener('click', async () => {
        const btn = document.getElementById('ddLogoutBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Terminating...';
        btn.style.pointerEvents = 'none';
        try {
            await signOut(auth);
            const isSub = window.location.pathname.includes('/components/') || window.location.pathname.includes('/menubar/');
            window.location.href = isSub ? '../../pages/index/index.html' : '../index/index.html'; 
        } catch (error) {
            console.error("Logout Error:", error);
            btn.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i> Error';
            btn.style.pointerEvents = 'auto';
        }
    });
</script>

<script>
(async function(){
    const { auth, db, ref, onValue, get, set, update } = await import('../../assets/scripts/core/firebase.js');

    const list = document.getElementById('notifPopupList');
    const icons = { reply:'fa-reply', deposit:'fa-coins', info:'fa-info-circle', promotion:'fa-tags', welcome:'fa-star' };
    const cls = { reply:'reply', deposit:'deposit', info:'info', promotion:'promotion', welcome:'welcome' };

    function renderAll(items) {
        if (!items.length) { list.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);font-size:12px;">No notifications yet</div>'; return; }
        items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        list.innerHTML = items.map(n => {
            const time = n.createdAt ? new Date(n.createdAt).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
            const link = n.link || '#';
            const clickHandler = link !== '#' ? `onclick="window.closeNotifPopup();setTimeout(()=>window.location.href='${link}',200)"` : '';
            return `<div class="notif-popup-item${n.read ? '' : ' unread'} ${link !== '#' ? 'notif-clickable' : ''}" ${clickHandler}>
                <div class="notif-popup-icon ${cls[n.type] || 'info'}"><i class="fas ${icons[n.type] || 'fa-info-circle'}"></i></div>
                <div class="notif-popup-content">
                    <div class="notif-popup-title-text">${n.title}</div>
                    <div class="notif-popup-msg">${n.message}</div>
                    <div class="notif-popup-time">${time}</div>
                </div>
            </div>`;
        }).join('');
    }

    const CUTOFF_DAYS = 7;

    async function loadAll() {
        const user = auth.currentUser;
        if (!user) { list.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);font-size:12px;">Not logged in</div>'; return; }
        const all = [];
        const cutoff = Date.now() - CUTOFF_DAYS * 24 * 60 * 60 * 1000;

        const snap = await get(ref(db, `notifications/${user.uid}`));
        if (snap.exists()) {
            const deletes = {};
            Object.entries(snap.val()).forEach(([id, n]) => {
                const ts = n.createdAt || 0;
                if (ts > 0 && ts < cutoff) {
                    deletes[`${id}`] = null;
                } else {
                    all.push({ id, ...n });
                }
            });
            if (Object.keys(deletes).length) await update(ref(db, `notifications/${user.uid}`), deletes);
        }

        const seenKey = 'nexus_seen_global_' + user.uid;
        let seen = [];
        try { seen = JSON.parse(localStorage.getItem(seenKey)) || []; } catch (_) {}
        try {
            const gSnap = await get(ref(db, 'global_alerts/promotions'));
            if (gSnap.exists()) {
                Object.entries(gSnap.val()).forEach(([id, n]) => {
                    if (!seen.includes(id)) {
                        all.push({ id: 'g_' + id, type: 'promotion', title: n.title || 'New Promotion', message: n.message || '', link: n.link || '#', createdAt: n.createdAt, read: false });
                        seen.push(id);
                    }
                });
                localStorage.setItem(seenKey, JSON.stringify(seen));
            }
        } catch (_) {}

        try {
            const wKey = 'nexus_welcome_' + user.uid;
            if (localStorage.getItem(wKey) === '1') {
                all.push({ id: 'welcome', type: 'welcome', title: 'Welcome to ' + (window.siteName || 'Nexus') + '!', message: 'Your account has been created successfully. Start exploring our panels!', link: '/pages/shop/shop.html', createdAt: Date.now(), read: false });
            }
        } catch (_) {}

        renderAll(all);

        onValue(ref(db, `notifications/${user.uid}`), (snap) => {
            if (!snap.exists()) return;
            const batch = {};
            Object.entries(snap.val()).forEach(([id, n]) => { if (!n.read) batch[`${id}/read`] = true; });
            if (Object.keys(batch).length) update(ref(db, `notifications/${user.uid}`), batch);
        }, { onlyOnce: true });
    }

    window.refreshNotifPopup = loadAll;

    window.closeNotifPopup = function(e) {
        const container = document.getElementById('notification-container');
        if (container) container.style.display = 'none';
        window.notifPopupOpen = false;
    };
    window.markAllRead = async function() {
        const user = auth.currentUser;
        if (!user) return;
        await set(ref(db, `notifications/${user.uid}`), null);
        try { localStorage.removeItem('nexus_welcome_' + user.uid); } catch (_) {}
        loadAll();
    };
})();
</script>

    <script type="module">
        import { auth, db, ref, onValue, onAuthStateChanged } from "./../../assets/scripts/core/firebase.js";

        function showToast(msg, type = 'success') {

        window.copyKey = function(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => showToast('Key copied!')).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
                showToast('Key copied!');
            });
        };

onAuthStateChanged(auth, (user) => {
if (!user) return window.location.href = "../../pages/index/index.html?tab=login";
