<style>

        left: 0;
        top: 0;

    .nexus-admin-sidebar.open {

        visibility: visible !important;

    .custom-scrollbar::-webkit-scrollbar { width: 5px; }

    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        border-bottom: 1px solid var(--sb-border);
        background: linear-gradient(180deg, rgba(188, 19, 254, 0.05) 0%, transparent 100%);
        position: relative;
    }
    .brand-logo-box {
        width: 36px; height: 36px;
        background: rgba(188, 19, 254, 0.1);
        border: 1px solid rgba(188, 19, 254, 0.3);
        border-radius: 10px;
        display: flex; justify-content: center; align-items: center;
        color: var(--sb-accent); font-size: 18px;
        margin-right: 12px; overflow: hidden;
        box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
    }
    .brand-logo-box img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text-glow {
        font-size: 19px; font-weight: 900; letter-spacing: 1.5px;
        background: linear-gradient(90deg, #bc13fe, #00f0ff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 5px rgba(188, 19, 254, 0.5));

    .sidebar-nav-menu { flex: 1; padding: 15px 0; overflow-y: auto; overflow-x: hidden; list-style: none; }
    
    .nav-group-title {

        color: #475569; text-transform: uppercase; letter-spacing: 2px;
    }

    .nav-item {
        position: relative;
        padding: 12px 25px; display: flex; align-items: center;

        overflow: hidden;
    }
    
    .nav-glow-bar {
        position: absolute; left: 0; top: 0; height: 100%; width: 3px;
        background: var(--sb-accent);
        box-shadow: 0 0 10px var(--sb-accent);
        transform: scaleY(0); transition: transform 0.3s ease;
    }

    .nav-icon { width: 26px; font-size: 15px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s; z-index: 2; }
    .nav-text { z-index: 2; transition: transform 0.3s ease; }

    .nav-item:hover { color: var(--sb-hover); background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, transparent 100%); }
    .nav-item:hover .nav-icon { transform: translateX(4px) scale(1.1); color: var(--sb-hover); }
    .nav-item:hover .nav-text { transform: translateX(4px); }
    .nav-item:hover .nav-glow-bar { transform: scaleY(0.5); opacity: 0.5; }
    
    .nav-item.active { color: var(--sb-hover); background: linear-gradient(90deg, rgba(188, 19, 254, 0.1) 0%, transparent 100%); }
    .nav-item.active .nav-glow-bar { transform: scaleY(1); opacity: 1; }

    .sidebar-logout-btn:hover .logout-scan { animation: scanLogout 1.5s infinite; }
    @keyframes scanLogout { 100% { left: 200%; } }

    .mobile-close-btn { display: none; background: transparent; border: none; color: var(--sb-text); font-size: 22px; position: absolute; right: 20px; cursor: pointer; transition: 0.3s; }

    #sidebar-overlay {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.75);
        backdrop-filter: blur(6px);

        z-index: 1000;
        transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #sidebar-overlay.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    @media (min-width: 769px) {
        #sidebar-overlay {
            display: none !important;
            pointer-events: none !important;
        }
        .mobile-close-btn { display: none; }
    }

    @media (max-width: 768px) {
        .nexus-admin-sidebar { transform: translateX(-100%); opacity: 0; visibility: hidden; box-shadow: 50px 0 100px rgba(0,0,0,0.9); }
        .nexus-admin-sidebar.open { transform: translateX(0); opacity: 1; visibility: visible; }
        .mobile-close-btn { display: block; }
        #sidebar-overlay { display: block; }
    }

    .light-theme .sidebar-brand-container,
    .light-theme .nexus-admin-sidebar {
        background: rgba(255,255,255,0.95);
        border-right-color: rgba(0,0,0,0.08);
    }

    .light-theme .nav-item {
        color: #4b5563;
    }

    .light-theme .nav-item:hover,
    .light-theme .nav-item.active {
        background: rgba(59,130,246,0.08);
    }

    .light-theme .nav-item.active .nav-icon,
    .light-theme .nav-item:hover .nav-icon {

    }

    .light-theme .sidebar-footer {
        background: rgba(248,248,250,0.9);
    }

    .light-theme .sidebar-logout-btn {
        background: rgba(239,68,68,0.08);
        color: #b91c1c;
        border-color: rgba(239,68,68,0.2);
    }

    .light-theme .sidebar-theme-toggle {

    .light-theme .sidebar-theme-toggle:hover {

<script>
(async function() {
    const { auth, signOut } = await import('../../assets/scripts/firebase.js');
    const { initBadges } = await import('../../assets/scripts/badges.js');
    initBadges();

    const sidebar = document.getElementById('nexusSidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const closeBtn = document.getElementById('mobileSidebarClose');
    const themeBtn = document.getElementById('sidebarThemeToggle');
    const logoutBtn = document.getElementById('sidebarLogoutBtn');

    function openSidebar() {
        if (sidebar) sidebar.classList.add('open');
        if (overlay) overlay.classList.add('open');
    }

    function closeSidebar() {
        if (sidebar) sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('open');
    }

    if (mobileBtn) mobileBtn.addEventListener('click', openSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
    if (overlay) overlay.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });

    if (themeBtn) {
        const applyTheme = (theme) => {
            document.body.classList.toggle('light-theme', theme === 'light');
            themeBtn.innerHTML = theme === 'light' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('nexusDashboardTheme', theme);
        };
        applyTheme(localStorage.getItem('nexusDashboardTheme') === 'light' ? 'light' : 'dark');
        themeBtn.addEventListener('click', () => applyTheme(document.body.classList.contains('light-theme') ? 'dark' : 'light'));
    }

    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            logoutBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>TERMINATING...</span>';
            logoutBtn.style.pointerEvents = 'none';
            try {
                await signOut(auth);
                window.location.href = '../../pages/index/index.html';
            } catch (error) {
                console.error('Logout Error:', error);
                logoutBtn.innerHTML = '<i class="fas fa-power-off"></i> <span>Secure Logout</span>';
                logoutBtn.style.pointerEvents = 'auto';
            }
        });
    }

    const links = document.querySelectorAll('.nav-item');
    const currentPage = window.location.pathname.split('/').pop().toLowerCase();
    links.forEach(link => {
        const href = (link.getAttribute('href') || '').split('/').pop().toLowerCase();
        if (href && currentPage === href) link.classList.add('active');

        link.addEventListener('click', (e) => {
            if (window.innerWidth > 768) return;
            e.preventDefault();
            closeSidebar();
            setTimeout(() => { window.location.href = link.getAttribute('href'); }, 250);
        });
    });

    if (window.innerWidth <= 768) closeSidebar();
})();
</script>
